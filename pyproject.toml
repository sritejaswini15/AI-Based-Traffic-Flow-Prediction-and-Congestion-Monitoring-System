[project]
name = "traffic-predictor"
version = "2.0.0"
description = "Short-term vehicle-count forecasts for six road junctions, served as a Flask web app."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins for deployment live in requirements.txt.
dependencies = [
    "Flask>=3.1",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:traffic_predictor.*"]
