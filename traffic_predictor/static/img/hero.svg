<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#14274a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.25" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="reveal"><rect width="1200" height="700" fill="url(#fade)"/></mask>
    <linearGradient id="band" x1="0" x2="1">
      <stop offset="0" stop-color="#f47230" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f47230" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g mask="url(#reveal)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- faint grid -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 140H1200M0 280H1200M0 420H1200M0 560H1200"/>
      <path d="M200 0V700M400 0V700M600 0V700M800 0V700M1000 0V700"/>
    </g>
    <!-- roads between six junctions -->
    <g stroke="#24375a" stroke-width="22">
      <path d="M560 700 L770 390 L1150 330"/>
      <path d="M770 390 L870 70"/>
      <path d="M770 390 L990 640"/>
      <path d="M1150 330 L1070 40"/>
      <path d="M990 640 L1150 330"/>
      <path d="M870 70 L1070 40"/>
    </g>
    <g stroke="#5b729c" stroke-width="2" stroke-dasharray="16 14">
      <path d="M560 700 L770 390 L1150 330"/>
      <path d="M770 390 L870 70"/>
      <path d="M770 390 L990 640"/>
      <path d="M1150 330 L1070 40"/>
      <path d="M990 640 L1150 330"/>
      <path d="M870 70 L1070 40"/>
    </g>
    <!-- recorded traffic, then the forecast with its range -->
    <path d="M380 560 C470 545 520 470 590 455 S690 300 760 285" stroke="#338ced" stroke-width="10" stroke-opacity="0.35" filter="url(#glow)"/>
    <path d="M380 560 C470 545 520 470 590 455 S690 300 760 285" stroke="#5aa2f0" stroke-width="4"/>
    <path d="M760 285 C830 270 880 190 960 205 S1080 300 1200 250 L1200 360 C1080 400 960 330 880 300 S800 300 760 285 Z" fill="url(#band)" stroke="none"/>
    <path d="M760 285 C830 268 880 220 960 238 S1080 330 1200 305" stroke="#f47230" stroke-width="4" stroke-dasharray="2 12"/>
    <circle cx="760" cy="285" r="7" fill="#f47230" stroke="#0a101c" stroke-width="3"/>
  </g>
  <!-- junctions, coloured by congestion level -->
  <g stroke="#0a101c" stroke-width="4">
    <circle cx="770" cy="390" r="13" fill="#dc3c3d"/>
    <circle cx="1150" cy="330" r="11" fill="#fbb315"/>
    <circle cx="990" cy="640" r="11" fill="#0aac23"/>
    <circle cx="870" cy="70" r="10" fill="#0aac23"/>
    <circle cx="1070" cy="40" r="10" fill="#fbb315"/>
    <circle cx="560" cy="700" r="10" fill="#0aac23" opacity="0.6"/>
  </g>
</svg>
